<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:rgba(220,38,38,0.95);color:white;padding:25px;font-family:monospace;white-space:pre-wrap;font-size:12px;z-index:999999;box-shadow:0 10px 30px rgba(0,0,0,0.5);overflow-y:auto;max-height:60vh;border-bottom:3px solid white;';
        div.textContent = '❌ Browser Runtime Error:\n' + e.message + '\nSource: ' + e.filename + ':' + e.lineno + '\n\nStack Trace:\n' + (e.error ? e.error.stack : 'No stack trace available');
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:rgba(220,38,38,0.95);color:white;padding:25px;font-family:monospace;white-space:pre-wrap;font-size:12px;z-index:999999;box-shadow:0 10px 30px rgba(0,0,0,0.5);overflow-y:auto;max-height:60vh;border-bottom:3px solid white;';
        div.textContent = '❌ Unhandled Promise Rejection:\n' + e.reason + '\n\nStack:\n' + (e.reason && e.reason.stack ? e.reason.stack : 'No stack trace');
        document.body.appendChild(div);
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track real-time weather telemetry, temperature trends, and 5-day forecasts for over 120 locations across all 9 provinces of Sri Lanka. Features geolocation alerts, favorites tracking, and multi-city comparisons." />
    <meta name="keywords" content="Sri Lanka, Weather, Tracker, Forecast, Temperature, Humidity, Colombo, Kandy, Galle, Jaffna, Open-Meteo, Glassmorphism" />
    <title>🌤️ Sri Lanka Weather Tracker - Real-time Telemetry & Forecasts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
